<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Telie Talkie</title>
  <desc id="desc">A hands-free Telegram voice intercom with local wake detection and persistent offline queues.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b1220"/><stop offset="1" stop-color="#1a3045"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5eead4"/><stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <circle cx="1050" cy="20" r="260" fill="#38bdf8" opacity=".04"/>
  <circle cx="1020" cy="330" r="180" fill="#5eead4" opacity=".04"/>
  <text x="64" y="86" font-family="sans-serif" font-size="14" font-weight="600" letter-spacing="4" fill="#5eead4">A TELEGRAM VOICE INTERCOM</text>
  <text x="60" y="167" font-family="sans-serif" font-size="68" font-weight="700" fill="#f8fafc">Telie Talkie</text>
  <text x="64" y="216" font-family="sans-serif" font-size="24" fill="#b9c7d9">Say hello. Keep the conversation going.</text>
  <rect x="64" y="260" width="142" height="34" rx="17" fill="#243c4d"/>
  <text x="135" y="282" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#a5f3e8">Local wake word</text>
  <rect x="220" y="260" width="131" height="34" rx="17" fill="#243c4d"/>
  <text x="285" y="282" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#a5f3e8">Offline queues</text>
  <rect x="365" y="260" width="141" height="34" rx="17" fill="#243c4d"/>
  <text x="435" y="282" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#a5f3e8">Raspberry Pi ready</text>
  <rect x="825" y="90" width="288" height="180" rx="40" fill="#172d3d" stroke="#446273" stroke-width="2"/>
  <path d="M865 267v29l40-29" fill="#172d3d" stroke="#446273" stroke-width="2"/>
  <g stroke="url(#accent)" stroke-width="12" stroke-linecap="round">
    <path d="M866 170v20 M900 149v62 M934 130v100 M968 154v52 M1002 118v124 M1036 144v72 M1070 164v32"/>
  </g>
</svg>
